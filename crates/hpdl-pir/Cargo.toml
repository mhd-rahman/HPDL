[package]
name = "hpdl-pir"
version = "0.2.0"
edition = "2021"
rust-version = "1.85.0"         # MSRV ratified in ADR 0001 (OD-02)
description = "HPDL canonical Planetary Interchange Representation — stable versioned contract crate"
license = "MIT OR Apache-2.0"

# IMPORTANT: hpdl-pir is a published contract crate.
# It MUST NOT depend on hpdl-compiler, hpdl-sema, or hpdl-ron.
# Only hpdl-model is permitted as a workspace dependency.
[dependencies]
bincode = "1"
# Published contract crate: the path dep carries an explicit version so the
# crate is valid on crates.io (cargo uses the registry version when published,
# the path when building in-workspace). hpdl-model must stay publishable.
hpdl-model = { path = "../hpdl-model", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
sha2 = "0.11"
thiserror = "2"

[features]
# No optional features at skeleton stage.

[dev-dependencies]
# SPIKE ONLY (not a shipped dependency): evaluate whether wincode 0.6.3 — a
# bincode-wire-compatible serializer from Anza — produces byte-identical output
# to bincode 1.3.3's default config for the shapes PIR encodes. Used only by
# tests/wincode_parity.rs. If parity holds, a real swap can be scoped under a
# maintenance ADR with the frozen golden vectors unchanged; if not, it is a PIR
# v3.0 format decision. Keep this out of [dependencies] until that is proven.
wincode = { version = "0.6.3", features = ["derive"] }

[[bench]]
name = "encode_bench"
harness = false
