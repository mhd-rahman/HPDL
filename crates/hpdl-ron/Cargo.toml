[package]
name = "hpdl-ron"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"         # MSRV ratified in ADR 0001 (OD-02)
description = "HPDL RON frontend — Serde/RON authoring input routed through the shared semantic validator"
license = "MIT OR Apache-2.0"
publish = false                 # internal frontend crate, not a published contract crate

[dependencies]
hpdl-model = { path = "../hpdl-model" }
hpdl-sema = { path = "../hpdl-sema" }
ron = { version = "0.8", features = ["integer128"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"

[features]
# No optional features at skeleton stage.

[dev-dependencies]

[[bench]]
name = "parse_bench"
harness = false
