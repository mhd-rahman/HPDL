[package]
name = "hpdl-model"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"         # MSRV ratified in ADR 0001 (OD-02)
description = "HPDL core domain model — typed immutable definitions shared by all crates"
license = "MIT OR Apache-2.0"

# No workspace dependencies — hpdl-model is the dependency root.
[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
# wincode schema derives live on the domain types so hpdl-pir can encode them
# with wincode (bincode-wire-compatible) instead of the unmaintained bincode
# 1.3.3 (RUSTSEC-2025-0141). See docs/rfcs/0015-migrate-bincode-to-wincode.md.
# Build-time proc-macro closure only; no runtime/ABI surface added to the model.
wincode = { version = "0.6.3", features = ["derive"] }

[features]
# No optional features at skeleton stage.
# Add feature flags here with an inline comment explaining each one.

[dev-dependencies]
# serde_json used only for golden fixture tests
serde_json = "1"
