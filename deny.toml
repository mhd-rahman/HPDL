# cargo-deny configuration for HPDL workspace
# Run: cargo deny check
# OD-05: License allowlist defaults to MIT and Apache-2.0. Confirm before publishing.

# ---------------------------------------------------------------------------
# License policy
# ---------------------------------------------------------------------------
[licenses]
# Opt into the cargo-deny v2 licenses schema.
version = 2
# Only these SPDX identifiers are allowed without an explicit exception.
# Any license not listed here (including copyleft) is denied, and crates with
# no detectable license are denied — both are the default behavior in schema v2.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",       # unicode-ident 1.0.27+ relicensed to (MIT OR Apache-2.0) AND Unicode-3.0
]

# Add exceptions here with a justification comment:
# [[licenses.exceptions]]
# name = "some-crate"
# version = "*"
# allow = ["LicenseRef-custom"]
# reason = "Vendor approval ref: TICKET-123"

# ---------------------------------------------------------------------------
# Security advisories
# ---------------------------------------------------------------------------
[advisories]
# Opt into the cargo-deny v2 advisories schema.
#
# In schema v2 the fine-grained severity knobs were removed: any crate with an
# unresolved RustSec advisory is denied by default (previously `vulnerability =
# "deny"`), and informational `unmaintained`/`notice` advisories no longer gate
# the check. Yanked crates remain denied.
version = 2
yanked = "deny"

# Ignored advisories. Each entry MUST have a documented rationale and should be
# backed by an ADR in docs/rfcs/.
#
# RUSTSEC-2025-0141 (bincode 1.3.3 "unmaintained") was removed here when the
# canonical PIR serializer was migrated to wincode (ADR 0015). bincode is no
# longer a dependency of this workspace at all — not shipped, and not a
# dev-dependency. No ignore is needed.
ignore = []

# ---------------------------------------------------------------------------
# Dependency bans — prevent duplicate versions of critical crates
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"              # no wildcard version requirements on registry crates
allow-wildcard-paths = true     # intra-workspace `{ path = "..." }` deps carry no version req; this is expected
highlight = "all"

# Explicitly deny known problematic crates:
deny = []

# Allow specific duplicate versions only when there is no resolution path:
# skip = [
#   { name = "some-crate", version = "=0.1.0", reason = "Waiting for upstream update" },
# ]

# ---------------------------------------------------------------------------
# Source policy — only allow crates from crates.io and local paths
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
