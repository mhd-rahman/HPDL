name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pinned toolchain — keep in sync with rust-toolchain.toml (ADR 0001, OD-01).
  RUST_VERSION: "1.99.1"
  # Documented MSRV (ADR 0001, OD-02). The msrv job proves the workspace builds here.
  RUST_MSRV: "1.85.0"

jobs:
  # ---------------------------------------------------------------------------
  # Main check — runs on all three platforms
  # ---------------------------------------------------------------------------
  check:
    name: check (${{ matrix.os }})
    # No leg may use continue-on-error: true without explicit approval (REQ-06)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # Uses deny.toml at repo root automatically

  # ---------------------------------------------------------------------------
  # MSRV — prove the workspace builds and tests on the documented minimum
  # supported Rust version (testing-ci steering: "MSRV job").
  # ---------------------------------------------------------------------------
  msrv:
    name: msrv (${{ env.RUST_MSRV }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_MSRV }}

      # Guard against rust-version drift (spec 16, REQ-06): every crate must
      # declare exactly the ratified MSRV (ADR 0001, OD-02). A crate missing the
      # field or declaring a different value fails here.
      - name: Check rust-version consistency across crates
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for manifest in crates/*/Cargo.toml; do
            line=$(grep -E '^\s*rust-version\s*=' "$manifest" || true)
            if [ -z "$line" ]; then
              echo "::error file=$manifest::missing rust-version (expected ${RUST_MSRV})"
              fail=1
              continue
            fi
            if ! echo "$line" | grep -q "\"${RUST_MSRV}\""; then
              echo "::error file=$manifest::rust-version mismatch: $line (expected \"${RUST_MSRV}\")"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "rust-version drift detected; reconcile to ${RUST_MSRV} (ADR 0001)."
            exit 1
          fi
          echo "All crates declare rust-version = ${RUST_MSRV}."

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-msrv-

      # Build + test only (fmt/clippy are tied to the pinned stable toolchain,
      # not the MSRV). This proves the code compiles and passes on the MSRV.
      - name: cargo build (MSRV)
        run: cargo build --workspace --all-targets

      - name: cargo test (MSRV)
        run: cargo test --workspace

  # ---------------------------------------------------------------------------
  # Cross-platform digest parity — the determinism steering requires comparing
  # PIR / replay hashes ACROSS OS jobs, not just pass/fail per job. Each OS runs
  # the `emit_digests` example, which:
  #   1. compiles a fixed set of determinism-sensitive fixtures (gas-composition
  #      map ordering, full orbital/thermal/hydrosphere surface, large
  #      magnitudes, and a locked package closure);
  #   2. compiles the dual-frontend fixture through BOTH native .hpdl and RON and
  #      asserts byte-identical PIR before emitting (fails here on any OS if the
  #      frontends diverge — ADR 0010);
  #   3. self-checks every emitted digest against the committed golden vector
  #      tests/golden/digest_parity.txt, so a canonical-byte change that is
  #      identical on all three platforms still fails (determinism steering:
  #      no silent vector regeneration).
  # The compare job then diffs the per-OS outputs to prove cross-OS byte
  # identity. Regenerate the golden deliberately with HPDL_BLESS_DIGESTS=1.
  # ---------------------------------------------------------------------------
  digest-parity-emit:
    name: digest-parity emit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Runs the determinism example and writes digests to digests.txt.
      # The example lives in hpdl-compiler (see examples/emit_digests.rs).
      - name: Emit canonical digests
        run: cargo run -p hpdl-compiler --example emit_digests > digests-${{ runner.os }}.txt

      - name: Upload digests
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ runner.os }}
          path: digests-${{ runner.os }}.txt

  digest-parity-compare:
    name: digest-parity compare
    runs-on: ubuntu-latest
    needs: digest-parity-emit

    steps:
      - name: Download all digest artifacts
        uses: actions/download-artifact@v8
        with:
          path: digests

      - name: Compare digests across platforms
        shell: bash
        run: |
          set -euo pipefail
          files=$(find digests -name 'digests-*.txt' | sort)
          echo "Comparing:"; echo "$files"
          reference=""
          for f in $files; do
            if [ -z "$reference" ]; then
              reference="$f"
              continue
            fi
            if ! diff -u "$reference" "$f"; then
              echo "::error::Canonical digests differ between $reference and $f"
              exit 1
            fi
          done
          echo "All platforms produced byte-identical canonical digests."

  # ---------------------------------------------------------------------------
  # Contract crate semver check — both published contract crates (hpdl-pir and
  # hpdl-runtime-api). Runs on ubuntu only (semver-checks is slow).
  # ---------------------------------------------------------------------------
  semver:
    name: semver-checks (contract crates)
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks

      - name: cargo semver-checks (hpdl-pir, hpdl-runtime-api)
        run: cargo semver-checks -p hpdl-pir -p hpdl-runtime-api

  # ---------------------------------------------------------------------------
  # Rustdoc — no missing_docs / broken intra-doc links on the published
  # contract crates.
  # ---------------------------------------------------------------------------
  docs:
    name: rustdoc (contract crates)
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: cargo doc (contract crates, deny missing_docs)
        env:
          RUSTDOCFLAGS: "-D missing_docs -D rustdoc::broken_intra_doc_links"
        run: cargo doc -p hpdl-pir -p hpdl-runtime-api --no-deps
