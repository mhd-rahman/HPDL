name: Security Audit

# Scheduled advisory sweep so a newly-published RustSec advisory against a pinned
# dependency is caught even when no code changes. Also runs when the dependency
# set or the deny policy changes, and can be triggered manually.
on:
  schedule:
    # 07:17 UTC every Monday (off the hour to avoid the scheduler stampede).
    - cron: "17 7 * * 1"
  push:
    branches: ["main"]
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/security-audit.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # cargo-deny advisories + bans + licenses + sources, using the repo deny.toml.
  cargo-deny:
    name: cargo-deny advisories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: cargo deny check advisories
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources

  # cargo-audit as a second, independent advisory source (RustSec DB directly).
  # The ignored advisory mirrors the documented deny.toml exception so the two
  # tools stay consistent (bincode 1.3.3 is a maintenance, not security, notice).
  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.81.0"

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit --ignore RUSTSEC-2025-0141
